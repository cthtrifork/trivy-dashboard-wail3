version: "2"

linters:
  settings:
    errcheck:
      # Closing a file or response body we only read from has nothing useful to report.
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
    staticcheck:
      # Default checks minus the "could use a tagged switch" quick fixes.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1002", "-QF1003"]
  exclusions:
    rules:
      # Test helpers write to temp dirs and httptest writers; a failure shows up in the assertions.
      - path: _test\.go
        linters: [errcheck]
