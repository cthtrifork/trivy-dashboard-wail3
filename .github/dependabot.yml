# Keeps Go modules (including Wails v3), the SHA-pinned
# actions in .github/workflows, the frontend npm packages, the default Trivy image version and the
# base images of the headless and dev container builds up to date.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2 # zizmor: ignore[dependabot-cooldown] 2 days chosen on purpose
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2 # zizmor: ignore[dependabot-cooldown] 2 days chosen on purpose
    groups:
      actions:
        patterns: ["*"]
  # zizmor, installed by the Actions lint workflow from .github/requirements.txt.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 2 # zizmor: ignore[dependabot-cooldown] 2 days chosen on purpose
  # The Vue + Vite frontend; the wails runtime package is kept in step with the Go module by hand.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 2 # zizmor: ignore[dependabot-cooldown] 2 days chosen on purpose
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@wailsio/runtime"
  # internal/trivy/image/Dockerfile holds the Trivy version scans run with (embedded in the binary).
  - package-ecosystem: docker
    directory: /internal/trivy/image
    schedule:
      interval: weekly
    cooldown:
      default-days: 2 # zizmor: ignore[dependabot-cooldown] 2 days chosen on purpose
  # The headless server image. Dependabot only recognises files with "dockerfile" in the name,
  # which is why this is not called Containerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2 # zizmor: ignore[dependabot-cooldown] 2 days chosen on purpose
  # The dev container's base images.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 2 # zizmor: ignore[dependabot-cooldown] 2 days chosen on purpose
