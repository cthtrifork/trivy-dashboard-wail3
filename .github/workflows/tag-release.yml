name: Tag and release

# Creates a git tag on main and releases it. Run it from the Actions tab ("Run workflow") or with
#   gh workflow run tag-release.yml                    (next version from the merged PR titles)
#   gh workflow run tag-release.yml -f bump=minor
#   gh workflow run tag-release.yml -f tag=v1.0.0
# Give either an explicit tag or choose a bump. A tag, when given, wins over the bump.
#
# The release is not left to a tag-push trigger: a tag pushed with the workflow's own GITHUB_TOKEN
# does not trigger other workflows, so this calls release.yml directly once the tag exists.
run-name: Tag and release ${{ inputs.tag != '' && inputs.tag || format('(next {0})', inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "auto takes the next version from the merged PR titles (Release Drafter); the others increase that part of the latest vX.Y.Z tag. Ignored when a tag name is given below."
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      tag:
        description: Or the exact new tag, such as v1.4.0 or v1.4.0-rc.1. Leave empty to use the bump.
        type: string
        required: false

permissions:
  contents: read

# Two releases at once could pick the same next version.
concurrency:
  group: tag-and-release
  cancel-in-progress: false

jobs:
  tag:
    name: create the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the tag; Release Drafter updates the draft release
      pull-requests: read # Release Drafter reads the merged PRs
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Releases come from main. Say so, rather than skipping the job and leaving a green run.
      - name: Releases must be started from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main, not on ${GITHUB_REF_NAME}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to find the latest version
          persist-credentials: true # this job pushes the tag; the token is limited to contents: write

      - name: Git identity for the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `auto`: the version is what Release Drafter works out from the PRs merged since the last release
      # (breaking change = major, feat = minor, anything else = patch; .github/release-drafter.yml).
      - name: Work out the next version
        id: draft
        if: inputs.tag == '' && inputs.bump == 'auto'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0

      - name: Create the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          # An explicit tag wins, then the version Release Drafter resolved (empty unless bump is auto).
          TAG_INPUT: ${{ inputs.tag || steps.draft.outputs.tag_name }}
        run: scripts/create-release-tag.sh

  release:
    name: release ${{ needs.tag.outputs.tag }}
    needs: tag
    # What release.yml's publish and image jobs need; a called workflow cannot have more than its caller grants.
    permissions:
      contents: write # update the draft release, upload assets and publish it
      pull-requests: read # Release Drafter reads the merged PRs
      packages: write # push the headless image to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write # store the attestations
    uses: $/.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    # The PGP key that signs the .deb and .rpm (RELEASE_GPG_*).
    secrets:
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
