name: Trivy DB cache

# Refreshes the Trivy vulnerability DB cache on the default branch every day, as the trivy-action
# README recommends. security.yml and dependency-scan.yml restore it (a pull request can read the
# default branch's caches) and set TRIVY_SKIP_DB_UPDATE, so they never download the DB themselves
# and are not hit by registry rate limits. The key and path are the ones trivy-action uses.
# The Java DB is not cached: this repository has no jar files for Trivy to scan.
on:
  schedule:
    - cron: '17 3 * * *' # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: update Trivy DB cache
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Download the vulnerability DB
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/trivy/db"
          oras pull ghcr.io/aquasecurity/trivy-db:2
          tar -xzf db.tar.gz -C "$GITHUB_WORKSPACE/.cache/trivy/db"
          rm db.tar.gz

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.date.outputs.date }}
