name: Screenshots (dependencies)

# The dependency graph (docs/screenshots/06-09) is a canvas whose anti-aliasing varies between runs,
# so screenshots.yml does not render it on main (it opened PRs with no real change). Instead a PR
# that changes the graph code renders it here and commits the images to its own branch, where the
# author reviews them in the diff.
#
# The commit is pushed with GITHUB_TOKEN, so no workflow starts on it: CI does not run on that
# commit and this workflow does not loop. Re-run CI (or push again) if a required check needs to
# report on the new head. Only a push that changes the graph code renders again, so a later,
# unrelated push never commits render noise. Fork PRs have a read-only token and are skipped.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - frontend/src/components/DepsPanel.vue
      - frontend/src/styles/deps.css
      - frontend/src/lib/graph.js

permissions:
  contents: read

concurrency:
  group: screenshots-deps-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  dependencies:
    name: dependencies
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push the images to the PR branch
    steps:
      # On the PR branch itself, not the merge commit, so the images can be committed to it. The
      # full history lets the next step ask what this push changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # The credentials stay: a later step pushes the images to the PR branch.
          persist-credentials: true # zizmor: ignore[artipacked]

      # `paths` above matches the whole PR against its base, so on a later push check that this
      # push itself touched the graph code. Keep this list in step with `paths`.
      - name: Did this push change the graph code?
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
        run: |
          code="frontend/src/components/DepsPanel.vue frontend/src/styles/deps.css frontend/src/lib/graph.js"
          if [ "$ACTION" = synchronize ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE HEAD"
          else
            range="origin/${BASE_REF}...HEAD"
          fi
          # shellcheck disable=SC2086
          if [ -n "$(git diff --name-only $range -- $code)" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "This push did not change the dependency graph code: nothing to render." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.changed.outputs.render
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      # scripts/screenshots.mjs pins Inter for the UI; DejaVu Sans Mono is the monospace default.
      - name: Install fonts
        if: steps.changed.outputs.render
        uses: $/.github/actions/linux-build-deps
        with:
          packages: fonts-inter fonts-dejavu-core

      - name: Generate screenshots
        if: steps.changed.outputs.render
        env:
          SCREENSHOT_BROWSER_CHANNEL: chrome
          SCREENSHOT_VIEWS: deps # only the dependency graph, 06-09
        run: make screenshots

      - name: Commit the dependency graph screenshots
        if: steps.changed.outputs.render
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          shots="docs/screenshots/0[6-9]-dependencies-*.png"
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $shots)" ]; then
            echo "The dependency graph screenshots are unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add $shots
          git commit -m "Update dependency graph screenshots"
          git push origin "HEAD:${HEAD_REF}"
          echo "Committed the dependency graph screenshots to \`${HEAD_REF}\`." | tee -a "$GITHUB_STEP_SUMMARY"
