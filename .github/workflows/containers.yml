name: Containers

# Builds the two container images Renovate bumps base images for, so a bad bump fails here
# instead of the next time someone runs `make headless` or opens the dev container.
# They use a paths filter (and a weekly run), so do not mark them as required checks.
on:
  pull_request:
    paths:
      - build/docker/headless.Dockerfile
      - .devcontainer/**
      - go.mod
      - go.sum
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/containers.yml
  push:
    branches: [main]
    paths:
      - build/docker/headless.Dockerfile
      - .devcontainer/**
      - go.mod
      - go.sum
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/containers.yml
  schedule:
    - cron: '47 5 * * 1' # Mondays 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.1
  # The DB comes from the cache that trivy-cache.yml refreshes daily.
  TRIVY_SKIP_DB_UPDATE: 'true'

jobs:
  headless:
    name: headless image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t trivy-scanner --build-arg VERSION=ci -f build/docker/headless.Dockerfile .

      # Scans the image just built: the Chainguard base and our Go binary. Same policy as the
      # filesystem scan in security.yml. The PR comment that lists what a change adds or removes
      # comes from dependency-scan.yml.
      #
      # The bundled podman-remote is upstream's prebuilt binary: its Go dependencies (stdlib, grpc,
      # x/net, go-jose) are fixed by a podman release, not by us, so it is left out of the gate and
      # reported by the next step instead. Remove skip-files when a podman release fixes them.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: trivy-scanner
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-files: /usr/local/bin/podman
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      # Everything including podman-remote, never fails the job; the table is in the job summary.
      - name: Report all findings
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: trivy-scanner
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: image-scan.txt
          exit-code: '0'
          version: ${{ env.TRIVY_VERSION }}

      - name: Add the report to the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Trivy image scan: all HIGH and CRITICAL findings with a fix'
            echo
            echo 'Includes the bundled `podman-remote`, which the blocking scan above skips.'
            echo
            echo '```'
            head -c 60000 image-scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The server must come up and serve the UI. It needs no podman socket just to start.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 -e WAILS_SERVER_HOST=0.0.0.0 trivy-scanner
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

  devcontainer:
    name: dev container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t trivy-scanner-dev .devcontainer

      - name: Check the toolchain
        run: docker run --rm trivy-scanner-dev bash -c 'go version && node --version && npm --version && podman --version && make --version | head -1'
