name: Containers

# Builds the two container images Renovate bumps base images for, so a bad bump fails here
# instead of the next time someone runs `make headless` or opens the dev container.
# They use a paths filter (and a weekly run), so do not mark them as required checks.
on:
  pull_request:
    paths:
      - build/docker/headless.Dockerfile
      - .devcontainer/**
      - go.mod
      - go.sum
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/containers.yml
  push:
    branches: [main]
    paths:
      - build/docker/headless.Dockerfile
      - .devcontainer/**
      - go.mod
      - go.sum
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/containers.yml
  schedule:
    - cron: '47 5 * * 1' # Mondays 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.1
  # The DB comes from the cache that trivy-cache.yml refreshes daily.
  TRIVY_SKIP_DB_UPDATE: 'true'

jobs:
  headless:
    name: headless image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t trivy-scanner --build-arg VERSION=ci -f build/docker/headless.Dockerfile .

      # Scans the image just built: the Chainguard base, the podman client and the Go binary. The
      # first scan only reports (exit-code 0, so the report is always produced); the second one is the
      # gate and uses the same policy as the filesystem scan in security.yml.
      - name: Scan image with Trivy (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: trivy-scanner
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: image-scan.txt
          exit-code: '0'
          version: ${{ env.TRIVY_VERSION }}

      - name: Build report
        run: |
          {
            echo '## Trivy image scan (headless image)'
            echo
            echo "Base image: \`cgr.dev/chainguard/static\`. HIGH and CRITICAL findings with a fix available, as the build gate counts them."
            echo
            echo '```'
            # GitHub comments are limited to 65536 characters.
            head -c 60000 image-scan.txt
            echo '```'
          } | tee report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-report
          path: report.md
          if-no-files-found: error

      - name: Scan image with Trivy (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: trivy-scanner
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      # The server must come up and serve the UI. It needs no podman socket just to start.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 -e WAILS_SERVER_HOST=0.0.0.0 trivy-scanner
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

  # Separate from the scan so the token that can write comments never sits next to the build. Runs
  # even when the gate fails (that is when the report matters most); fork PRs get a read-only
  # token, so a failure here must not fail the run, the report is in the job summary.
  comment:
    name: comment on pull request
    needs: headless
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # create or update the report comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-scan-report

      - name: Comment on pull request
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-image-scan
          path: report.md

  devcontainer:
    name: dev container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t trivy-scanner-dev .devcontainer

      - name: Check the toolchain
        run: docker run --rm trivy-scanner-dev bash -c 'go version && node --version && npm --version && podman --version && make --version | head -1'
