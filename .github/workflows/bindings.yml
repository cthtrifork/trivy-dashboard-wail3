name: Bindings

# When a pull request changes Go code, regenerate frontend/bindings with the wails3 CLI at the
# go.mod version and push the result to the PR branch, so stale bindings never cause rebase
# conflicts or a failing "Check Wails bindings" step in CI. Same-repository PRs only (a fork's
# token is read-only). The commit is pushed with the Renovate GitHub App's token so CI runs on it;
# a second run finds nothing to regenerate and exits, so there is no loop.
on:
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/bindings.yml

permissions: {}

concurrency:
  group: bindings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  bindings:
    name: bindings
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # the push uses the App token
    steps:
      # Push with the GitHub App's token, not GITHUB_TOKEN: a push made with GITHUB_TOKEN starts no
      # workflows, so CI would never report on the bot commit. The App is the one Renovate uses.
      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write # push the commit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # needed to push the bindings commit

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # go.mod requires 1.26.x (Wails v3)
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Generate bindings
        run: |
          GOBIN="$RUNNER_TEMP/bin" make wails3-install
          PATH="$RUNNER_TEMP/bin:$PATH" make bindings

      - name: Commit and push
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- frontend/bindings)" ]; then
            echo "Bindings are up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/bindings
          git commit -m "Regenerate Wails bindings"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "Pushed regenerated bindings to \`${HEAD_REF}\`." | tee -a "$GITHUB_STEP_SUMMARY"
