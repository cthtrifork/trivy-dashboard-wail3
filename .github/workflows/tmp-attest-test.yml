name: tmp attest test
# TEMPORARY: exercises the release workflow's SBOM attestation steps on dummy files. Delete after use.
on:
  push:
    branches: [claude/serene-faraday-54ntvz]
permissions:
  contents: read
jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Make dummy dist
        run: |
          mkdir dist
          echo "tmp attest test $GITHUB_SHA" > dist/trivy-scanner_linux_amd64
          cat > dist/trivy-scanner_v0.0.0-tmp.sbom.cdx.json <<'J'
          {"$schema":"http://cyclonedx.org/schema/bom-1.5.schema.json","bomFormat":"CycloneDX","specVersion":"1.5","serialNumber":"urn:uuid:3e671687-395b-41f5-a30f-a58921a69b79","version":1,"metadata":{"timestamp":"2026-10-26T00:00:00Z","component":{"type":"application","name":"trivy-scanner","bom-ref":"app"}},"components":[{"type":"library","name":"example","version":"1.0.0","bom-ref":"pkg:golang/example@1.0.0","purl":"pkg:golang/example@1.0.0"}]}
          J

      - name: Locate SBOM
        id: sbom
        run: echo "path=$(ls dist/*.sbom.cdx.json)" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*_linux_amd64
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh attestation verify dist/*_linux_amd64 --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/tmp-attest-test.yml" \
            --predicate-type https://cyclonedx.org/bom
