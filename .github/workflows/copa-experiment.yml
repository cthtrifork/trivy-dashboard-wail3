name: Copa experiment

# EXPERIMENT, never required and never fails the PR: does Copacetic (project-copacetic/copacetic)
# lower the HIGH findings in the headless image? They are in upstream's podman-remote (Go stdlib, grpc,
# x/net, go-jose), which only Copa's experimental Go binary rebuild could touch. Like the headless
# image job in containers.yml it runs when the image's inputs change: it builds the image, patches it
# (.github/actions/copa-patch), and comments the Trivy before/after on the PR. The release workflow
# publishes the patched image as <version>-copa. Uses a paths filter, so do not mark it as required.
on:
  pull_request:
    paths:
      - build/docker/headless.Dockerfile
      - go.mod
      - go.sum
      - frontend/package.json
      - frontend/package-lock.json
      - .github/actions/copa-patch/**
      - .github/workflows/copa-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copa-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.1
  # renovate: datasource=go depName=github.com/project-copacetic/copacetic
  COPA_VERSION: v0.15.0
  # The DB comes from the cache that trivy-cache.yml refreshes daily.
  TRIVY_SKIP_DB_UPDATE: 'true'

jobs:
  copa:
    name: copa patch (experiment)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t trivy-scanner --build-arg VERSION=copa -f build/docker/headless.Dockerfile .

      # podman-remote is built by upstream, so its source is the podman repository at the version the
      # Dockerfile pins (the go-vcs-url input), and the small image Copa patches is built on the
      # final stage's base image.
      - name: Podman source and base image for Copa
        id: podman
        run: |
          echo "url=https://github.com/containers/podman@$(sed -n 's/^ARG PODMAN_VERSION=//p' build/docker/headless.Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "base=$(grep -E '^FROM cgr\.dev/' build/docker/headless.Dockerfile | tail -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/copa-patch
        with:
          image: trivy-scanner:latest
          patched-tag: patched
          copa-version: ${{ env.COPA_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}
          go-vcs-url: ${{ steps.podman.outputs.url }}
          binary: /usr/local/bin/podman
          base-image: ${{ steps.podman.outputs.base }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: copa-report
          path: copa-report.md
          if-no-files-found: ignore

  # Separate from the scan so the token that can write comments never sits next to the build.
  # Fork PRs get a read-only token, so a failure here must not fail the run; the report is in the
  # job summary.
  comment:
    name: comment on pull request
    needs: copa
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # create or update the report comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: copa-report

      - name: Comment on pull request
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-copa-scan
          path: copa-report.md
