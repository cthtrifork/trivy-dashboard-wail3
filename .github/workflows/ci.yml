name: CI

# Runs on every pull request and on pushes to main. There is deliberately no
# paths filter, so "CI / test" can be a required status check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail on a Go version mismatch instead of silently downloading a toolchain.
  GOTOOLCHAIN: local

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wails v3 builds against GTK4 + WebKitGTK 6 on Linux (package list from the Wails CI).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true # newest 1.26 patch release, so stdlib fixes are picked up
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy and modules verify
        run: |
          go mod tidy -diff
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Vet (production tags)
        run: go vet -tags production ./...

      - name: Test
        run: go test -race -count=1 ./...

      # Proves the GUI binary still links against GTK4/WebKitGTK (cgo), exactly as the release build does.
      - name: Build (production tags)
        run: go build -tags production -trimpath -buildvcs=false -o /dev/null .

      # Demo mode replays bundled fixtures. It must never exist in a production binary.
      - name: Production build contains no demo mode
        run: |
          go build -tags production -trimpath -buildvcs=false -o "$RUNNER_TEMP/app" .
          if grep -aqF "[fixtures] replaying" "$RUNNER_TEMP/app"; then
            echo "::error::demo-mode code is present in a -tags production binary"; exit 1
          fi

      - name: Check frontend JavaScript parses
        run: |
          for f in frontend/*.js; do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done

  # The release binary is built on Ubuntu but must also run on Fedora, whose GTK4/WebKitGTK
  # packages, glibc and `podman search` behaviour differ. This builds and tests natively on
  # Fedora and then starts the real GUI binary under a virtual display (scripts/smoke-gui.sh).
  fedora:
    name: fedora (${{ matrix.tag }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # rawhide is an early warning for upcoming package changes, not a gate.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false # a failure on one release must not hide the others
      matrix:
        include:
          - { tag: latest, experimental: false }
          - { tag: rawhide, experimental: true }
    container: fedora:${{ matrix.tag }}
    steps:
      - name: Install build and smoke-test dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gcc pkgconf-pkg-config gtk4-devel webkitgtk6.0-devel libX11-devel wayland-devel \
            git tar gzip zstd \
            xorg-x11-server-Xvfb xorg-x11-utils ImageMagick dbus-daemon mesa-dri-drivers dejavu-sans-fonts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Versions
        run: |
          cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)='
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      - name: Vet and test
        run: |
          go vet ./...
          go vet -tags production ./...
          go test -race -count=1 ./...

      - name: Build (production tags)
        run: |
          mkdir -p dist
          go build -tags production -trimpath -buildvcs=false -ldflags "-w -s" -o dist/trivy-scanner .

      - name: Start the GUI binary and check it renders
        run: scripts/smoke-gui.sh dist/trivy-scanner "$RUNNER_TEMP/fedora-${{ matrix.tag }}.png"

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora-${{ matrix.tag }}-gui
          path: ${{ runner.temp }}/fedora-${{ matrix.tag }}.png
          if-no-files-found: ignore
          retention-days: 14
