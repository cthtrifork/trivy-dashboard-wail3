name: CI

# Runs on every pull request and on pushes to main. There is deliberately no
# paths filter, so "CI / test" can be a required status check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail on a Go version mismatch instead of silently downloading a toolchain.
  GOTOOLCHAIN: local

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wails v3 builds against GTK4 + WebKitGTK 6 on Linux (package list from the Wails CI).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true # newest 1.26 patch release, so stdlib fixes are picked up
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy and modules verify
        run: |
          go mod tidy -diff
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Vet (production tags)
        run: go vet -tags production ./...

      - name: Test
        run: go test -race -count=1 ./...

      # Proves the GUI binary still links against GTK4/WebKitGTK (cgo), exactly as the release build does.
      - name: Build (production tags)
        run: go build -tags production -trimpath -buildvcs=false -o /dev/null .

      # Demo mode replays bundled fixtures. It must never exist in a production binary.
      - name: Production build contains no demo mode
        run: |
          go build -tags production -trimpath -buildvcs=false -o "$RUNNER_TEMP/app" .
          if grep -aq "TRIVY_SCANNER_REAL_PODMAN" "$RUNNER_TEMP/app"; then
            echo "::error::demo-mode code is present in a -tags production binary"; exit 1
          fi

      - name: Check frontend JavaScript parses
        run: |
          for f in frontend/*.js; do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done
