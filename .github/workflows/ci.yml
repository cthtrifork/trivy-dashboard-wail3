name: CI

# Runs on every pull request and on pushes to main. There is deliberately no
# paths filter, so "CI / test" can be a required status check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail on a Go version mismatch instead of silently downloading a toolchain.
  GOTOOLCHAIN: local

jobs:
  # Fast, GTK-free checks. The slower jobs below wait for these so a trivial failure
  # (formatting, stale bindings) is reported in about a minute instead of after the tests.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true # newest 1.26 patch release, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      # The Go binary embeds frontend/dist, so the Vue app is built first. The runner's Node
      # satisfies Vite's engines range (see frontend/package.json).
      - name: Build frontend
        working-directory: frontend
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # ESLint (errors only, see frontend/eslint.config.js) and Prettier. Run `npm run format` to fix.
      - name: Lint and check formatting (frontend)
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check

      # frontend/bindings is generated from the Go services and committed. Regenerate it with the
      # CLI version that matches go.mod and fail if the committed copy differs (run `make bindings`).
      - name: Check Wails bindings are up to date
        run: |
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          (cd "$RUNNER_TEMP" && CGO_ENABLED=0 GOBIN="$RUNNER_TEMP/bin" go install -tags server "github.com/wailsapp/wails/v3/cmd/wails3@${version}")
          CGO_ENABLED=0 "$RUNNER_TEMP/bin/wails3" generate bindings -silent
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            git status --short -- frontend/bindings
            git diff -- frontend/bindings | head -80
            echo "::error::frontend/bindings is stale: run 'make bindings' and commit the result"; exit 1
          fi

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy and modules verify
        run: |
          go mod tidy -diff
          go mod verify

      # Config in .golangci.yml. Installed like the wails3 CLI above: pinned, built with the job's Go.
      - name: golangci-lint
        run: |
          (cd "$RUNNER_TEMP" && CGO_ENABLED=0 GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0)
          # Headless: this job has no GTK, so lint the server-tag build (CGO off, like the headless build).
          CGO_ENABLED=0 "$RUNNER_TEMP/bin/golangci-lint" run --build-tags server ./...

  vet:
    name: vet
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wails v3 builds against GTK4 + WebKitGTK 6 on Linux (package list from the Wails CI).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true # newest 1.26 patch release, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      # No frontend build: frontend/dist/.gitkeep satisfies go:embed, and nothing here reads the bundle.
      - name: Vet
        run: go vet ./...

      - name: Vet (production tags)
        run: go vet -tags production ./...

  test:
    name: test
    needs: [lint, vet]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wails v3 builds against GTK4 + WebKitGTK 6 on Linux (package list from the Wails CI).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true # newest 1.26 patch release, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      # Record exactly which toolchain and GUI libraries a run used (as wails-build-action does with `go version`).
      - name: Toolchain versions
        run: |
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      # No frontend build: frontend/dist/.gitkeep satisfies go:embed, and nothing here reads the bundle.
      - name: Test
        run: go test -race -count=1 ./...

  # Runs in parallel with test once lint and vet pass.
  build:
    name: build
    needs: [lint, vet]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wails v3 builds against GTK4 + WebKitGTK 6 on Linux (package list from the Wails CI).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true # newest 1.26 patch release, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      # The Go binary embeds frontend/dist, so the Vue app is built first. The runner's Node
      # satisfies Vite's engines range (see frontend/package.json).
      - name: Build frontend
        working-directory: frontend
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # Proves the GUI binary still links against GTK4/WebKitGTK (cgo), exactly as the release build does.
      # Same flags as the release build, so the binary reviewers download is what would ship.
      - name: Build (production tags)
        run: |
          mkdir -p dist
          go build -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s -X main.version=ci-${GITHUB_SHA::7}" -o dist/trivy-scanner .
          chmod +x dist/trivy-scanner
          ls -l dist

      # Demo mode replays bundled fixtures. It must never exist in a production binary.
      - name: Production build contains no demo mode
        run: |
          if grep -aqF "[fixtures] replaying" dist/trivy-scanner; then
            echo "::error::demo-mode code is present in a -tags production binary"; exit 1
          fi

      # One named artifact per platform, like the action's "Wails Build <os> <name>". Unsigned CI build, for testing only.
      - name: Keep the binary for reviewers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-scanner-linux-amd64
          path: dist/trivy-scanner
          if-no-files-found: error
          retention-days: 7
