name: CI

# Runs on every pull request and on pushes to main. There is deliberately no
# paths filter, so "CI / test" can be a required status check.
on:
  pull_request:
  push:
    branches: [main]
  # The Screenshots workflow pushes bot/update-screenshots with GITHUB_TOKEN, which does not
  # trigger pull_request runs; it dispatches CI on that branch so the required checks report.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail on a Go version mismatch instead of silently downloading a toolchain.
  GOTOOLCHAIN: local

jobs:
  # lint, test and build run in parallel: wall time is the slowest job, not their sum.
  # A trivial failure still shows up in lint first, but no longer holds the others back.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true # newest 1.26 patch release, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      # The Go binary embeds frontend/dist, so the Vue app is built first. The runner's Node
      # satisfies Vite's engines range (see frontend/package.json). `make build` below does this
      # itself in the build job.
      - name: Build frontend
        run: |
          node --version
          make frontend

      # Biome lint (see frontend/biome.json) and format check. Run `npm run format` to fix.
      - name: Lint and check formatting (frontend)
        run: make lint-frontend

      # frontend/bindings is generated from the Go services and committed. Regenerate it with the
      # CLI version that matches go.mod and fail if the committed copy differs (run `make bindings`).
      - name: Check Wails bindings are up to date
        run: |
          GOBIN="$RUNNER_TEMP/bin" make wails3-install
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH" make bindings
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            git status --short -- frontend/bindings
            git diff -- frontend/bindings | head -80
            echo "::error::frontend/bindings is stale: run 'make bindings' and commit the result"; exit 1
          fi

      - name: Check formatting
        run: make fmt-check

      - name: Check go.mod is tidy and modules verify
        run: make mod-check

      # Config in .golangci.yml. Installed like the wails3 CLI above: pinned, built with the job's Go.
      - name: golangci-lint
        run: |
          (cd "$RUNNER_TEMP" && CGO_ENABLED=0 GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0)
          # Headless: this job has no GTK, so lint the server-tag build (CGO off, like the headless build).
          PATH="$RUNNER_TEMP/bin:$PATH" make lint-go

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/linux-build-deps

        with:

          packages: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
        timeout-minutes: 10

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true # newest 1.26 patch release, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      # Record exactly which toolchain and GUI libraries a run used (as wails-build-action does with `go version`).
      - name: Toolchain versions
        run: |
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      # No frontend build: frontend/dist/.gitkeep satisfies go:embed, and nothing here reads the bundle.
      - name: Vet
        run: make vet

      - name: Test
        run: make test

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/linux-build-deps

        with:

          packages: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
        timeout-minutes: 10

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true # newest 1.26 patch release, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      # Proves the GUI binary still links against GTK4/WebKitGTK (cgo), exactly as the release build does.
      # `make build` builds the frontend first and uses the same flags as the release build, so the binary reviewers download is what would ship.
      - name: Build (production tags)
        run: |
          mkdir -p dist
          make build VERSION="ci-${GITHUB_SHA::7}" OUT=dist/trivy-scanner
          chmod +x dist/trivy-scanner
          ls -l dist

      # Demo mode replays bundled fixtures. It must never exist in a production binary.
      - name: Production build contains no demo mode
        run: |
          if grep -aqF "[fixtures] replaying" dist/trivy-scanner; then
            echo "::error::demo-mode code is present in a -tags production binary"; exit 1
          fi

      # The Wails MCP server drives the UI and calls ScanService without authentication by default.
      - name: Production build contains no MCP server
        run: |
          if grep -aqF "MCP server started" dist/trivy-scanner; then
            echo "::error::the MCP server is present in a -tags production binary"; exit 1
          fi

      # One named artifact per platform, like the action's "Wails Build <os> <name>". Unsigned CI build, for testing only.
      - name: Keep the binary for reviewers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-scanner-linux-amd64
          path: dist/trivy-scanner
          if-no-files-found: error
          retention-days: 7
