name: Screenshots

# When a pull request changes the UI (frontend/**), regenerate docs/screenshots from the recorded
# fixtures and push the result to the PR branch, so the screenshots in the README never go stale.
#
# - Same-repository PRs only: a fork's token is read-only, and a fork's code must not run with
#   write access. Dependabot PRs are skipped for the same reason (read-only token); frontend
#   dependencies do not exist, so they never touch frontend/ anyway.
# - Pushes made with GITHUB_TOKEN do not start other workflows, which would leave the PR head
#   without a "CI / test" result and block merging. So after pushing, this workflow starts CI on
#   the branch itself (workflow_dispatch, which GITHUB_TOKEN is allowed to do).
# - Nothing is committed unless a screenshot changed visibly (scripts/sync-screenshots.sh), so a
#   re-run on an unchanged UI is a no-op.
on:
  pull_request:
    paths:
      - frontend/**
      - scripts/screenshots.*
      - scripts/sync-screenshots.sh
  workflow_dispatch:

permissions:
  contents: write # push the screenshot commit to the PR branch
  actions: write  # start CI on that commit

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # Pinned so the rendering does not change underneath committed images.
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  screenshots:
    name: screenshots
    # workflow_dispatch has no PR: it regenerates on the selected branch, but never pushes to the
    # default branch (changes reach main through pull requests only).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch) ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true # needed to push the screenshot commit

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # go.mod requires 1.26.x (Wails v3)
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Install Playwright, Chromium and ImageMagick
        run: |
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Generate screenshots
        run: scripts/screenshots.sh "$RUNNER_TEMP/screenshots"

      - name: Keep the ones that changed visibly
        run: scripts/sync-screenshots.sh "$RUNNER_TEMP/screenshots" docs/screenshots

      - name: Commit and push
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/screenshots && [ -z "$(git ls-files --others --exclude-standard docs/screenshots)" ]; then
            echo "Screenshots are up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update screenshots" -m "Regenerated by the Screenshots workflow because frontend/ changed."
          # Fails (and says so) if someone pushed to the branch meanwhile; the next push re-runs this.
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "Pushed updated screenshots to \`${HEAD_REF}\`." | tee -a "$GITHUB_STEP_SUMMARY"
          # A GITHUB_TOKEN push triggers nothing, so run CI for the new head ourselves.
          gh workflow run ci.yml --ref "$HEAD_REF"
          echo "Started CI on the new commit." | tee -a "$GITHUB_STEP_SUMMARY"
