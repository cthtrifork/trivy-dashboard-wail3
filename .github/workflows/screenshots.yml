name: Screenshots

# The screenshots are never committed to main: docs/screenshots is gitignored and rendered here.
#
#   pull_request  Render the screenshots from the recorded fixtures, upload each image as its own
#                 unzipped artifact (`archive: false`) and embed them in one sticky PR comment
#                 that is updated on every push. Nothing is pushed anywhere. Fork PRs (read-only
#                 token) get the artifacts on the run page but no comment. The dependency graph
#                 (06-09) is left out: its canvas anti-aliasing varies between runs.
#   push to main  Render everything, force-push the images as one commit on top of main to
#                 bot/update-screenshots and keep one DRAFT PR open from it ("Screenshots
#                 preview"). The PR exists only so the current images can be browsed in its
#                 "Files changed" tab. It is never merged: it is a draft (GitHub refuses to merge
#                 a draft), the CI job `no-screenshots` fails on it, and the workflow turns it back
#                 into a draft if someone marks it ready. Close it and the next run opens a new one.
#
# Nothing ever lands on main, so there is no loop and no binary merge conflict.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - frontend/**
      - scripts/screenshots.*
      - internal/trivy/fixtures/**
      - .github/workflows/screenshots.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - scripts/screenshots.*
      - internal/trivy/fixtures/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  screenshots:
    name: screenshots
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # main-only pushes use the App token
      pull-requests: write # the sticky comment (PRs)
    steps:
      # Push with the GitHub App's token, not GITHUB_TOKEN: a push made with GITHUB_TOKEN starts no
      # workflows, so CI would never report on the bot commit. The App is the one Renovate uses.
      - name: Get a GitHub App token
        id: app-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write # push the commit
          permission-pull-requests: write # open and update the preview PR

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: ${{ github.event_name != 'pull_request' }} # only the main run pushes # zizmor: ignore[artipacked]

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      # scripts/screenshots.mjs pins Inter for the UI; DejaVu Sans Mono is the monospace default.
      - name: Install fonts
        uses: $/.github/actions/linux-build-deps
        with:
          packages: fonts-inter fonts-dejavu-core

      - name: Generate screenshots
        env:
          SCREENSHOT_BROWSER_CHANNEL: chrome
          # Pull requests skip the dependency graph (see the header); the preview on main renders it.
          SCREENSHOT_VIEWS: ${{ github.event_name == 'pull_request' && 'core' || 'all' }}
        run: make screenshots

      - name: Upload 00-invalid-image-ref
        id: shot-00-invalid-image-ref
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/00-invalid-image-ref.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 01-priorities
        id: shot-01-priorities
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/01-priorities.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 01b-priorities-expanded-row
        id: shot-01b-priorities-expanded-row
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/01b-priorities-expanded-row.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 02-priorities-vex-editor
        id: shot-02-priorities-vex-editor
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/02-priorities-vex-editor.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 03-priorities-export-openvex
        id: shot-03-priorities-export-openvex
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/03-priorities-export-openvex.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 03a-priorities-import-error
        id: shot-03a-priorities-import-error
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/03a-priorities-import-error.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 03b-priorities-import-openvex
        id: shot-03b-priorities-import-openvex
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/03b-priorities-import-openvex.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 04-vulnerabilities
        id: shot-04-vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/04-vulnerabilities.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 05-vulnerability-details
        id: shot-05-vulnerability-details
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/05-vulnerability-details.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 05b-vulnerability-ratings-by-source
        id: shot-05b-vulnerability-ratings-by-source
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/05b-vulnerability-ratings-by-source.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 10-sbom
        id: shot-10-sbom
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/10-sbom.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 11-compare-vulnerabilities
        id: shot-11-compare-vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/11-compare-vulnerabilities.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 12-compare-packages
        id: shot-12-compare-packages
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/12-compare-packages.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 13-log
        id: shot-13-log
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/13-log.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 14-options
        id: shot-14-options
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/14-options.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 15-ignore-rules
        id: shot-15-ignore-rules
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/15-ignore-rules.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Upload 16-help
        id: shot-16-help
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/screenshots/16-help.png
          archive: false # one file per artifact, so it can be embedded; the file name is the artifact name
          if-no-files-found: error
          retention-days: 14

      - name: Build the screenshots comment
        id: comment-body
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STEPS: ${{ toJSON(steps) }}
        run: |
          # Every PNG rendered here needs an `Upload` step above; fail loudly when a screenshot was added.
          want="$(ls docs/screenshots/*.png | grep -vc -- -dependencies-)" # the graph is only rendered on main
          have="$(jq '[to_entries[] | select(.key | startswith("shot-"))] | length' <<<"$STEPS")"
          if [ "$want" != "$have" ]; then
            echo "::error::docs/screenshots has $want images but screenshots.yml uploads $have: add or remove an 'Upload <name>' step."
            exit 1
          fi

          body="$(mktemp)"
          {
            echo "### Screenshots"
            echo
            echo "Rendered from the recorded fixtures at ${HEAD_SHA::7}. Not committed: screenshots never live in the repository, the draft PR \`bot/update-screenshots\` shows the ones from \`main\`. Images are run artifacts: you must be logged in to see them, and they expire after 14 days."
            echo
            jq -r 'to_entries[] | select(.key | startswith("shot-")) | "\(.key[5:])\t\(.value.outputs["artifact-url"])"' <<<"$STEPS" |
              while IFS=$'\t' read -r name url; do
                # As in homeserver-bootc's screenshot action: a heading, then the bare artifact URL as
                # its own paragraph, with no HTML wrapper, which GitHub renders inline.
                echo "#### ${name}"
                echo
                echo "${url}"
                echo
              done
          } > "$body"

          echo "path=$body" >> "$GITHUB_OUTPUT"
          echo "Screenshots are in the PR comment and in the run's artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Show screenshots in a PR comment
        if: steps.comment-body.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: screenshots-preview
          path: ${{ steps.comment-body.outputs.path }}

      - name: Summarise (fork pull request)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Rendered \`docs/screenshots\`. This is a fork PR (read-only token), so there is no PR comment: the images are in this run's artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Update the screenshots preview PR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: bot/update-screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -f docs/screenshots # the folder is gitignored
          # Skip the push when nothing but the graph's canvas noise differs from the branch.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null &&
            git diff --cached --quiet "origin/$BRANCH" -- docs/screenshots ':!docs/screenshots/*-dependencies-*'; then
            echo "The screenshots preview is up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Screenshots preview (never merge)"
          # Always rebuilt from the current main, so the branch cannot conflict with it.
          git push --force origin "$BRANCH"
          body="Preview of the screenshots rendered from the recorded fixtures on \`main\` (${GITHUB_SHA::7}). **Never merge this PR**: screenshots do not live in the repository. Open *Files changed* to see the images; the branch is rebuilt on every push to \`main\`."
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -z "$pr" ]; then
            gh pr create --draft --base main --head "$BRANCH" --title "Screenshots preview (do not merge)" --body "$body"
          else
            gh pr edit "$pr" --body "$body"
            gh pr ready "$pr" --undo || true # a draft cannot be merged
          fi
          echo "Screenshots preview PR for \`${BRANCH}\` is up to date." | tee -a "$GITHUB_STEP_SUMMARY"
