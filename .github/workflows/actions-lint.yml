name: Actions lint

# Static checks on the workflows themselves:
#   - zizmor finds security problems in workflows and composite actions (injection, excessive
#     permissions, cache poisoning, unpinned or impostor action refs, ...).
#   - pin-format fails when a `uses:` is not pinned to a commit SHA with a version comment. It is
#     deterministic, so it runs on every event.
#   - gh-pin-actions warns when a `uses:` is not the latest release. Renovate owns freshness, and a
#     release can land before its PR does, so this is advisory, on pull requests only, and only for
#     the workflows the PR adds or changes.
#   - renovate-config validates .github/renovate.json5 with renovate-config-validator.
#   - trivy-template renders .github/trivy/dependency-scan.tpl from a recorded scan (Trivy has no template linter).
# They run when workflow, action or Renovate files change, and weekly, because new zizmor audits
# and advisories appear without any change here. They use a paths filter, so do not mark them as
# required checks.
on:
  pull_request:
    paths:
      - .github/**
  push:
    branches: [main]
    paths:
      - .github/**
  schedule:
    - cron: '41 5 * * 1' # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pedantic persona. Installed from PyPI rather than through a marketplace action. The token lets zizmor run its
      # online audits (impostor commits, known-vulnerable actions); findings fail the job.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=pypi depName=zizmor
          ZIZMOR_VERSION: 1.31.1
        run: |
          python3 -m pip install --user "zizmor==${ZIZMOR_VERSION}"
          "$HOME/.local/bin/zizmor" --persona pedantic --format plain .

  pin-format:
    name: pin format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Local references ($/ or ./) and non-uses lines are skipped; everything else must read
      # `owner/repo[/path]@<40 hex> # vX`.
      - name: Fail on actions not pinned to a SHA with a version comment
        run: |
          bad="$(grep -rnE '^\s*(-\s+)?uses:' .github --include='*.yml' --include='*.yaml' \
            | grep -vE 'uses: +(\$|\.)/' \
            | grep -vE 'uses: +[^@ ]+@[0-9a-f]{40} +# *v[0-9]' || true)"
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Pin every action to a commit SHA with a '# vX.Y.Z' comment"; exit 1
          fi

  # Advisory: Renovate owns freshness, and a new release can land before its PR does.
  pin-actions:
    name: latest actions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # all_changed_files lists added, copied, modified and renamed files, not deleted ones.
      - name: Find the workflows this pull request adds or changes
        id: changed
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files: .github/workflows/**.{yml,yaml}

      # --latest re-pins every `uses:` in .github/workflows to the newest release (SHA plus version
      # comment). The tool always rewrites all workflows; the next step only looks at the ones the
      # pull request adds or changes, and only reports a different version, not the tool's SHA to tag rewrite.
      - name: Pin actions
        if: steps.changed.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=amenocal/gh-pin-actions
          GH_PIN_ACTIONS_VERSION: v0.1.0
        run: |
          gh extension install amenocal/gh-pin-actions --pin "$GH_PIN_ACTIONS_VERSION"
          gh pin-actions workflows --latest --overwrite

      - name: Warn on outdated actions
        if: steps.changed.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          # For immutable releases the tool writes the tag instead of the SHA: same version, so
          # compare `action@<sha> # vX` as `action@vX`. Any other difference is a warning.
          norm='s/(uses: [^@ ]+)@[0-9a-f]{40} +# *([^ ]+).*/\1@\2/'
          for f in $CHANGED_FILES; do
            diff <(git show "HEAD:$f" | sed -E "$norm") <(sed -E "$norm" "$f") \
              || echo "::warning file=$f::An action in this workflow has a newer release; Renovate will bump it"
          done

  renovate-config:
    name: renovate config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validates .github/renovate.json5 against Renovate's own schema and rules (unknown options,
      # bad regexes, invalid package rules). --strict also fails on a config that needs migrating.
      - name: Validate the Renovate config
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.196.0
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict .github/renovate.json5

  trivy-template:
    name: trivy template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.1

      # `trivy convert` renders a template from recorded JSON without scanning, so a broken template
      # (or one that no longer produces findings) fails here instead of silently in the PR comment.
      - name: Render the dependency scan template
        run: |
          trivy convert --format template --template @.github/trivy/dependency-scan.tpl \
            --output rendered.tsv internal/trivy/fixtures/traefik_3.7.13.json
          grep -qP '^\S.*\t- [A-Z]+ \[[A-Z]+-.*\]\(https://' rendered.tsv
