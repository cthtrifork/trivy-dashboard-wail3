name: Actions lint

# Static checks on the workflows themselves:
#   - zizmor finds security problems in workflows and composite actions (injection, excessive
#     permissions, cache poisoning, unpinned or impostor action refs, ...).
#   - gh-pin-actions checks that every `uses:` is pinned to a commit SHA with a version comment, and
#     that it is the latest release. On pull requests only the workflows the PR adds or changes.
# They run when workflow, action or Dependabot files change, and weekly, because new zizmor audits
# and advisories appear without any change here. They use a paths filter, so do not mark them as
# required checks.
on:
  pull_request:
    paths:
      - .github/**
  push:
    branches: [main]
    paths:
      - .github/**
  schedule:
    - cron: '41 5 * * 1' # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pedantic persona; see .github/zizmor.yml for the one threshold we relax. Installed from PyPI rather than through a marketplace action. The token lets zizmor run its
      # online audits (impostor commits, known-vulnerable actions); findings fail the job.
      - name: Run zizmor
        env:
          ZIZMOR_VERSION: 1.31.1
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --user "zizmor==${ZIZMOR_VERSION}"
          "$HOME/.local/bin/zizmor" --persona pedantic --format plain .

  pin-actions:
    name: pin actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the pull request check diffs against the base commit
          persist-credentials: false

      # --latest re-pins every `uses:` in .github/workflows to the newest release (SHA plus version
      # comment). The tool always rewrites all workflows; the next step only looks at the ones the
      # pull request adds or changes, so a release of an action elsewhere does not fail unrelated PRs,
      # and only fails on a different version, not on the tool's SHA to tag rewrite.
      - name: Pin actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install amenocal/gh-pin-actions --pin v0.1.0
          gh pin-actions workflows --latest --overwrite

      - name: Fail on unpinned or outdated actions
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No workflow added or changed in this pull request."
              exit 0
            fi
            printf 'Checking %s\n' "${files[@]}"
          else
            files=(.github/workflows)
          fi
          # Not a plain git diff: for immutable releases the tool writes the tag instead of the SHA.
          if ! scripts/check-pinned-actions.py "${files[@]}"; then
            echo "::error::Fix the actions above, e.g. with 'gh pin-actions workflows --latest --overwrite'."
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- .github/workflows)" ]; then
            git ls-files --others --exclude-standard -- .github/workflows
            echo "::error::gh pin-actions left unexpected files in .github/workflows."
            exit 1
          fi
