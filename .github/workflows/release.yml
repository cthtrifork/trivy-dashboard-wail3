name: Release

# Publishes a GitHub release with a Linux amd64 binary, a tarball, SHA256SUMS, a CycloneDX SBOM and
# signed attestations (build provenance for the binary, tarball and SBOM; the SBOM bound to the binary). The in-app updater installs the raw binary and verifies it against SHA256SUMS, so those
# names are an interface. Three ways to run it:
#   - the "Tag and release" workflow creates a tag and calls this one (workflow_call). This is the
#     normal route. It has to call rather than rely on the tag push below, because a tag pushed with
#     the workflow's own GITHUB_TOKEN does not trigger other workflows.
#   - pushing a tag like v1.2.3 (or v1.2.3-rc.1 for a pre-release) from a machine, which triggers it
#   - running it by hand (workflow_dispatch) on a branch for a dry run that builds but does not
#     publish. Dispatched on a tag ref it publishes, which also retries a release that failed.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The existing tag to release (v1.2.3 or v1.2.3-rc.1)
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  APP: trivy-scanner

jobs:
  build:
    name: build linux/amd64
    # Pinned rather than "latest": the binary links dynamically against glibc,
    # so the runner image decides which distributions can run it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called with a tag, build exactly that tag; otherwise the ref that triggered the run.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          fetch-depth: 0
          persist-credentials: false

      # The README promises a binary built on Ubuntu 24.04 (that fixes the glibc and WebKitGTK
      # baseline). Like wails-build-action's distro discovery, fail loudly if the runner is
      # anything else instead of silently shipping a different baseline.
      - name: Check the build distribution
        run: |
          . /etc/os-release
          if [ "$ID" != "ubuntu" ] || [ "$VERSION_ID" != "24.04" ]; then
            echo "::error::Expected Ubuntu 24.04 but this runner is $PRETTY_NAME"; exit 1
          fi
          echo "Building on $PRETTY_NAME"

      - name: Work out the version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # publish=true when there is a tag to release, false for a dry run on a branch.
          if [ -n "$INPUT_TAG" ]; then
            version="$INPUT_TAG"; publish=true
          elif [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"; publish=true
          else
            version="v0.0.0-dryrun.$(git rev-parse --short HEAD)"; publish=false
          fi
          if [ "$publish" = true ] && ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$version' is not a semantic version like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Releases must come from main
        if: steps.meta.outputs.publish == 'true'
        run: |
          git fetch --no-tags origin main
          # HEAD is the tagged commit (checked out above), whichever way this run started.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit is not on main"; exit 1
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Toolchain versions
        run: |
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      # The Go binary embeds frontend/dist, so the Vue app is built first. The runner's Node
      # satisfies Vite's engines range (see frontend/package.json).
      - name: Build frontend
        working-directory: frontend
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # Never ship something CI would have rejected.
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          built="$RUNNER_TEMP/build/${APP}"
          mkdir -p "$(dirname "$built")"
          go build -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s -X main.version=${VERSION}" \
            -o "$built" .
          chmod +x "$built"
          # Demo mode replays bundled fixtures. It must never ship in a release.
          if grep -aqF "[fixtures] replaying" "$built"; then
            echo "::error::demo-mode code is present in the release binary"; exit 1
          fi
          # Raw binary (what the in-app updater installs), tarball (for people) and SHA256SUMS.
          # The layout matters: see scripts/package-release.sh and internal/selfupdate.
          scripts/package-release.sh "$built" "${VERSION}" dist

      # CycloneDX SBOM from the lockfiles (go.mod/go.sum and frontend/package-lock.json), i.e. the Go
      # modules and the npm packages bundled into the binary. Named without os/arch so the in-app
      # updater's asset matcher cannot mistake it for the binary. No vulnerability scanner runs here;
      # security.yml already does that.
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          scanners: license
          output: ${{ runner.temp }}/sbom.cdx.json
          skip-dirs: internal/trivy/fixtures,frontend/node_modules,dist

      - name: Add SBOM to the release files
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/sbom.cdx.json" "dist/${APP}_${VERSION}.sbom.cdx.json"
          # SHA256SUMS lists every asset, so regenerate it with the SBOM included.
          (cd dist && sha256sum "${APP}_linux_amd64" "${APP}_${VERSION}_linux_amd64.tar.gz" \
            "${APP}_${VERSION}.sbom.cdx.json" > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_linux_amd64
            dist/*.sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*_linux_amd64
          sbom-path: dist/*.sbom.cdx.json

      # Fail the release if what was just signed does not verify against this workflow.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for f in dist/*_linux_amd64 dist/*.tar.gz dist/*.sbom.cdx.json; do
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml"
          done
          gh attestation verify dist/*_linux_amd64 --repo "$REPO" \
            --predicate-type https://cyclonedx.org/bom

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* "${flags[@]}"
