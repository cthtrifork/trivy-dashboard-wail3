name: Release

# Push a tag like v1.2.3 (or v1.2.3-rc.1 for a pre-release) to publish a GitHub
# release with a Linux amd64 binary, checksums and a build-provenance attestation.
# Run it manually (workflow_dispatch) for a dry run that builds but does not publish.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  APP: trivy-scanner

jobs:
  build:
    name: build linux/amd64
    # Pinned rather than "latest": the binary links dynamically against glibc,
    # so the runner image decides which distributions can run it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The README promises a binary built on Ubuntu 24.04 (that fixes the glibc and WebKitGTK
      # baseline). Like wails-build-action's distro discovery, fail loudly if the runner is
      # anything else instead of silently shipping a different baseline.
      - name: Check the build distribution
        run: |
          . /etc/os-release
          if [ "$ID" != "ubuntu" ] || [ "$VERSION_ID" != "24.04" ]; then
            echo "::error::Expected Ubuntu 24.04 but this runner is $PRETTY_NAME"; exit 1
          fi
          echo "Building on $PRETTY_NAME"

      - name: Work out the version
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
            if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag '$version' is not a semantic version like v1.2.3 or v1.2.3-rc.1"; exit 1
            fi
          else
            version="v0.0.0-dryrun.$(git rev-parse --short HEAD)"
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - name: Releases must come from main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit is not on main"; exit 1
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Toolchain versions
        run: |
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      # Never ship something CI would have rejected.
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/pkg
          go build -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s -X main.version=${VERSION}" \
            -o "dist/pkg/${APP}" .
          chmod +x "dist/pkg/${APP}"
          # Demo mode replays bundled fixtures. It must never ship in a release.
          if grep -aqF "[fixtures] replaying" "dist/pkg/${APP}"; then
            echo "::error::demo-mode code is present in the release binary"; exit 1
          fi
          cp README.md dist/pkg/
          [ -f LICENSE ] && cp LICENSE dist/pkg/ || true
          archive="${APP}_${VERSION}_linux_amd64.tar.gz"
          tar -C dist/pkg -czf "dist/${archive}" .
          (cd dist && sha256sum "${archive}" > "${APP}_${VERSION}_checksums.txt")
          rm -rf dist/pkg
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* "${flags[@]}"
