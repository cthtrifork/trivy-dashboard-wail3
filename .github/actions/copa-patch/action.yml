name: Copa patch
description: >-
  Scans a container image with Trivy, patches one Go binary of it with Copacetic's experimental
  rebuild, rescans and smoke-tests the result, and writes a Markdown before/after report to
  copa-report.md. Copa rebuilds every Go binary in an image from the one --go-vcs-url source, so it
  only sees a small image holding the binary to patch; the patched binary is then layered over the
  original image. The image must be pullable by the Docker daemon (local or registry). The result is
  loaded into the local Docker daemon as <image without tag>:<patched-tag>; pushing it is up to the
  caller. Never fails the calling job: look at the `copa-outcome` and `smoke-outcome` outputs.
  Experimental, see docs/ci.md.

inputs:
  image:
    description: Image with a tag, in a registry (e.g. ghcr.io/org/app:1.2.3).
    required: true
  patched-tag:
    description: Tag of the patched image (e.g. 1.2.3-copa).
    required: true
  copa-version:
    description: Copacetic release to build with `go install` (e.g. v0.15.0).
    required: true
  trivy-version:
    description: Trivy release for the scans (e.g. v0.76.1).
    required: true
  go-vcs-url:
    description: >-
      Source of the binary to rebuild, as repo@ref (e.g. https://github.com/containers/podman@v6.1.4).
      Needed when the binary has no VCS information and the image's own source label points elsewhere,
      as it does for an image built on a base image's labels.
    required: false
    default: ''
  binary:
    description: Path in the image of the Go binary to patch (e.g. /usr/local/bin/podman).
    required: true
  base-image:
    description: >-
      Image the small image holding only that binary is built on (e.g. the base image of the final stage,
      with its digest). Copa needs an image with an operating system.
    required: true

outputs:
  patched-image:
    description: Reference of the patched image in the local Docker daemon.
    value: ${{ steps.names.outputs.patched }}
  copa-outcome:
    description: Outcome of the patch step (success, failure).
    value: ${{ steps.layer.outcome == 'success' && 'success' || 'failure' }}
  smoke-outcome:
    description: Outcome of the smoke test of the patched image (success, failure, skipped).
    value: ${{ steps.smoke.outcome }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .tool-versions
        cache: false

    # Copa v0.15.0 does not pass the binary's -tags to `go build`, which podman-remote needs (copa-tags.patch,
    # a suggested upstream fix, see docs/ci.md). So Copa is built from its tag with the
    # patch applied instead of installed with `go install`. Drop the patch when upstream has the fix.
    - name: Build Copa with the -tags patch and create the builder
      shell: bash
      env:
        COPA_VERSION: ${{ inputs.copa-version }}
      run: |
        git clone --quiet --depth 1 --branch "$COPA_VERSION" https://github.com/project-copacetic/copacetic "$RUNNER_TEMP/copa-src"
        git -C "$RUNNER_TEMP/copa-src" apply "$GITHUB_ACTION_PATH/copa-tags.patch"
        (cd "$RUNNER_TEMP/copa-src" && GOTOOLCHAIN=auto go build -o "$RUNNER_TEMP/copa-bin/copacetic" .)
        # The runner's default Docker builder has no `docker` exporter, which Copa needs to load the
        # patched image. A docker-container builder has one; host network lets it reach a local registry.
        docker buildx create --name copa --driver docker-container --driver-opt network=host --bootstrap

    - id: names
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PATCHED_TAG: ${{ inputs.patched-tag }}
      run: echo "patched=${IMAGE%:*}:${PATCHED_TAG}" >> "$GITHUB_OUTPUT"

    # os and library findings, as Copa's docs ask for; HIGH and CRITICAL with a fix.
    - name: Scan before
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_PKG_TYPES: os,library
      with:
        scan-type: image
        image-ref: ${{ inputs.image }}
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: json
        output: before.json
        exit-code: '0'
        version: ${{ inputs.trivy-version }}

    # A docker-container builder cannot see the daemon's images, so the small image Copa patches goes
    # through a throwaway local registry on port 5000 (host network, so the builder reaches it).
    - name: Build the small image with only the binary
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        BINARY: ${{ inputs.binary }}
        BASE: ${{ inputs.base-image }}
      run: |
        docker run -d --name copa-registry --network host mirror.gcr.io/library/registry:3
        for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:5000/v2/ && break; sleep 1; done
        curl -fsS -o /dev/null http://localhost:5000/v2/ || { docker logs copa-registry; exit 1; }
        mkdir -p "$RUNNER_TEMP/copa-mini"
        printf 'FROM %s AS src\nFROM %s\nCOPY --from=src %s %s\n' "$IMAGE" "$BASE" "$BINARY" "$BINARY" > "$RUNNER_TEMP/copa-mini/Dockerfile"
        docker build -t localhost:5000/copa-mini:latest "$RUNNER_TEMP/copa-mini"
        docker push localhost:5000/copa-mini:latest

    - name: Scan the small image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_PKG_TYPES: os,library
      with:
        scan-type: image
        image-ref: localhost:5000/copa-mini:latest
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: json
        output: mini-before.json
        exit-code: '0'
        version: ${{ inputs.trivy-version }}

    - name: Patch with Copa
      id: copa
      continue-on-error: true
      shell: bash
      env:
        COPA_EXPERIMENTAL: '1'
        GO_VCS_URL: ${{ inputs.go-vcs-url }}
      run: |
        args=(--pkg-types library --toolchain-patch-level --addr docker-container://buildx_buildkit_copa0)
        [ -n "$GO_VCS_URL" ] && args+=(--go-vcs-url "$GO_VCS_URL")
        "$RUNNER_TEMP/copa-bin/copacetic" patch -i localhost:5000/copa-mini:latest -r mini-before.json -t patched "${args[@]}" 2>&1 | tee copa.log

    # Layer the patched binary over the original image, so everything else stays as it was.
    - name: Put the patched binary into the image
      id: layer
      if: steps.copa.outcome == 'success'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        BINARY: ${{ inputs.binary }}
        PATCHED: ${{ steps.names.outputs.patched }}
      run: |
        mkdir -p "$RUNNER_TEMP/copa-final"
        printf 'FROM %s\nCOPY --from=localhost:5000/copa-mini:patched %s %s\n' "$IMAGE" "$BINARY" "$BINARY" > "$RUNNER_TEMP/copa-final/Dockerfile"
        docker build -t "$PATCHED" "$RUNNER_TEMP/copa-final"

    - name: Scan after
      if: steps.layer.outcome == 'success'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_PKG_TYPES: os,library
      with:
        scan-type: image
        image-ref: ${{ steps.names.outputs.patched }}
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: json
        output: after.json
        exit-code: '0'
        version: ${{ inputs.trivy-version }}

    # The patched image must still start and serve the UI, and its podman must still run.
    - name: Smoke test the patched image
      id: smoke
      if: steps.layer.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        PATCHED: ${{ steps.names.outputs.patched }}
      run: |
        docker run --rm --entrypoint /usr/local/bin/podman "$PATCHED" --version
        docker run -d --name smoke -p 8080:8080 -e WAILS_SERVER_HOST=0.0.0.0 "$PATCHED"
        for i in $(seq 1 30); do
          curl -fsS -o /dev/null http://127.0.0.1:8080/ && exit 0
          sleep 1
        done
        docker logs smoke
        exit 1

    - name: Report
      if: ${{ !cancelled() }}
      shell: bash
      env:
        COPA_VERSION: ${{ inputs.copa-version }}
        IMAGE: ${{ inputs.image }}
        PATCHED: ${{ steps.names.outputs.patched }}
        COPA_OUTCOME: ${{ steps.layer.outcome == 'success' && 'success' || steps.copa.outcome == 'success' && 'patched but not layered' || 'failure' }}
        SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
      run: |
        count() { jq '[.Results[]?.Vulnerabilities[]?] | length' "$1"; }
        per() { jq -r '.Results[]? | select((.Vulnerabilities // []) | length > 0) | "| `\(.Target)` | \(.Vulnerabilities | length) |"' "$1"; }
        {
          echo '## Trivy scan of the Copa-patched headless image'
          echo
          echo "Experimental: Copa \`${COPA_VERSION}\` (Go binary rebuild), patch step **${COPA_OUTCOME}**, smoke test **${SMOKE_OUTCOME:-skipped}**."
          echo
          if [ -f after.json ]; then
            echo "HIGH and CRITICAL findings with a fix: **$(count before.json)** before, **$(count after.json)** after (\`${PATCHED##*:}\`)."
          else
            echo "HIGH and CRITICAL findings with a fix: **$(count before.json)**. No patched image was produced."
          fi
          echo
          echo '| Target (before) | Findings |'
          echo '|---|---|'
          per before.json
          if [ -f after.json ]; then
            echo
            echo '| Target (after) | Findings |'
            echo '|---|---|'
            per after.json
          fi
          echo
          echo '<details><summary>Copa log (last 40 lines)</summary>'
          echo
          echo '```'
          tail -n 40 copa.log 2>/dev/null || echo 'no log'
          echo '```'
          echo '</details>'
        } | tee copa-report.md >> "$GITHUB_STEP_SUMMARY"
