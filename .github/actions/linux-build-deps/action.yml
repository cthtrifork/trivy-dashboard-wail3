name: Linux build dependencies
description: >-
  Installs the GTK4 + WebKitGTK 6 build headers Wails v3 needs (package list from the Wails CI).
  The .deb files are cached per runner image, so a warm run installs them with dpkg and never
  touches the Ubuntu mirror.

runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/apt-debs
        key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('.github/actions/linux-build-deps/action.yml') }}

    - name: Install
      shell: bash
      run: |
        install='
          if [ "${{ steps.cache.outputs.cache-hit }}" = true ] && sudo dpkg -i ~/apt-debs/*.deb; then
            exit 0
          fi
          sudo apt-get -o Acquire::Languages=none update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
          # The debs apt just downloaded are exactly what this image lacks; keep them for the cache.
          mkdir -p ~/apt-debs
          cp /var/cache/apt/archives/*.deb ~/apt-debs/
        '
        # A stalled mirror trickles data forever and apt'"'"'s own timeout never fires, so bound each attempt.
        for attempt in 1 2 3; do
          timeout 180 bash -ec "$install" && exit 0
          echo "::warning::attempt $attempt failed or timed out"
        done
        exit 1
