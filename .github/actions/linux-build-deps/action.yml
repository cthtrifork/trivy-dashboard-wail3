name: Linux build dependencies
description: >-
  Installs the GTK4 + WebKitGTK 6 build headers Wails v3 needs (package list from the Wails CI).
  The downloaded .deb files are cached per runner image, so a warm run installs them with dpkg
  and skips apt-get update and the mirror downloads.

runs:
  using: composite
  steps:
    # ImageVersion changes whenever GitHub rebuilds the runner image, so the cached debs always
    # match the preinstalled package set (the closure saved is exactly what that image was missing).
    - id: image
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/apt-debs
        key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('.github/actions/linux-build-deps/action.yml') }}

    - name: Install from cache
      id: warm
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        if sudo dpkg -i ~/apt-debs/*.deb; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::cached packages failed to install, falling back to apt"
        fi

    - name: Install with apt
      if: steps.warm.outputs.installed != 'true'
      shell: bash
      run: |
        pkgs="build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev"
        apt_opts=(-o Acquire::Languages=none -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dpkg::Use-Pty=0)
        # The hosted Ubuntu mirror occasionally crawls. Download in bounded attempts (a killed
        # download is safe, a killed dpkg is not), then install from the local archive.
        for attempt in 1 2 3; do
          if sudo timeout 120 apt-get "${apt_opts[@]}" update -qq &&
             sudo timeout 120 apt-get "${apt_opts[@]}" install -y --no-install-recommends --download-only $pkgs; then
            break
          fi
          [ "$attempt" = 3 ] && { echo "::error::apt download failed after 3 attempts"; exit 1; }
          echo "::warning::apt download attempt $attempt stalled, retrying"
        done
        sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends $pkgs
        # Keep the downloaded debs (exactly the closure this image lacked) for the cache post step.
        mkdir -p ~/apt-debs
        cp /var/cache/apt/archives/*.deb ~/apt-debs/
